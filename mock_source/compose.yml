name: dw-dew

networks:
  dw:
    external: true
    name: ${DW_NETWORK_NAME:-dw-dew_dw}

volumes:
  mock_source_data:

services:
  mock-source-db:
    image: docker.io/library/postgres:18
    container_name: dw-mock-source-db
    hostname: mock-source-db
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${MOCK_SOURCE_DB:-mock_source}
      POSTGRES_USER: ${MOCK_SOURCE_DB_USER:-mock_source}
      POSTGRES_PASSWORD: ${MOCK_SOURCE_DB_PASSWORD:-mocksourcepass}
    volumes:
      - mock_source_data:/var/lib/postgresql
    ports:
      - "${MOCK_SOURCE_DB_PORT:-5437}:5432"
    networks: [dw]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MOCK_SOURCE_DB_USER:-mock_source} -d ${MOCK_SOURCE_DB:-mock_source}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-source-api:
    build:
      context: .
    container_name: dw-mock-source-api
    hostname: mock-source-api
    environment:
      TZ: ${TZ:-UTC}
      MOCK_SOURCE_DB_HOST: mock-source-db
      MOCK_SOURCE_DB_PORT: 5432
      MOCK_SOURCE_DB: ${MOCK_SOURCE_DB:-mock_source}
      MOCK_SOURCE_DB_USER: ${MOCK_SOURCE_DB_USER:-mock_source}
      MOCK_SOURCE_DB_PASSWORD: ${MOCK_SOURCE_DB_PASSWORD:-mocksourcepass}
    ports:
      - "${MOCK_SOURCE_API_PORT:-8090}:8000"
    networks: [dw]
    depends_on:
      mock-source-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 10
